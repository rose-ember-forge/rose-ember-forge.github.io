name: Check build

# Renders the site without deploying, so a broken build shows up before it reaches main
on:
  push:
    branches: [workshop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
      - name: Render site
        run: quarto render
