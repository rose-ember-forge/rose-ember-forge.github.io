project:
  type: website
  output-dir: _site
  resources:
    - files/
    - assets/effects.js
    - assets/intro.js
    - assets/layout.js

website:
  title: "Raghunandan Rajkumar"
  description: "Data scientist and analyst in Stockholm. Python, SQL, machine learning and clear reporting."
  site-url: "https://rose-ember-forge.github.io"
  favicon: assets/favicon.png
  open-graph: true
  navbar:
    left:
      - text: Projects
        href: index.qmd#projects
      - text: About
        href: index.qmd#about
      - text: Contact
        href: contact.qmd
    right:
      - icon: github
        href: https://github.com/rose-ember-forge
        aria-label: GitHub
      - icon: linkedin
        href: https://www.linkedin.com/in/raghunandan-rajkumar
        aria-label: LinkedIn
  page-footer:
    left: "© 2026 Raghunandan Rajkumar"
    right: "Built with [Quarto](https://quarto.org)"

format:
  html:
    theme:
      dark: [darkly, theme-dark.scss, styles.scss]
      light: [flatly, theme-light.scss, styles.scss]
    include-in-header:
      text: |
        <script>
          // The About page moved onto the home page; send old links there
          var movedPage = /\/about\.html$/.test(location.pathname);
          if (movedPage) location.replace("./#about");
          document.documentElement.classList.add("nav-auto");
          try {
            if (!movedPage && !sessionStorage.getItem("introSeen") &&
                !window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
              document.documentElement.classList.add("intro-pending");
            }
          } catch (e) {}
        </script>
    include-after-body:
      text: |
        <script src="/assets/intro.js"></script>
        <script src="/assets/effects.js"></script>
        <script src="/assets/layout.js"></script>
    toc: false
    page-layout: full
    smooth-scroll: true
    link-external-newwindow: true
